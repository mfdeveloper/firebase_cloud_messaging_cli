# =============================================================================
# Kotlin Build - GitHub Actions Workflow
# =============================================================================
# Builds the Kotlin project and creates the fat JAR distribution using Gradle.
#
# This workflow can be:
#   - Run manually via workflow_dispatch
#   - Called by other workflows via workflow_call
#
# Usage in another workflow:
#   jobs:
#     build:
#       uses: ./.github/workflows/kotlin-build.yml
# =============================================================================

name: Kotlin > Build

on:
  # Manual trigger
  workflow_dispatch:

  # Allow other workflows to call this one
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Build fat JAR
        run: ./gradlew fatJar

      - name: Set artifact name
        id: set-artifact-name
        run: echo "name=kotlin-package-distributions" >> $GITHUB_OUTPUT

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.name }}
          path: |
            build/libs/*.jar

      - name: List built packages
        run: ls -la build/libs/

      - name: Verify fat JAR works
        run: java -jar build/libs/fcm-send-all.jar --version
