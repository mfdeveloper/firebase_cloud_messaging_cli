# =============================================================================
# Kotlin Integration Test - GitHub Actions Workflow
# =============================================================================
# Tests that the library can be consumed as a dependency by other projects.
# Uses the lib-consumer-test/ project to verify imports work correctly.
#
# Run locally with: act -W .github/workflows/kotlin-integration.yml
# =============================================================================

name: Kotlin > Integration Test

on:
  push:
    branches: [kotlin-cli]
    paths:
      - 'src/main/kotlin/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'lib-consumer-test/**'
      - '.github/workflows/kotlin-integration.yml'
  pull_request:
    branches: [kotlin-cli]
    paths:
      - 'src/main/kotlin/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'lib-consumer-test/**'
      - '.github/workflows/kotlin-integration.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  integration-test:
    name: Test as Library Dependency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Prepare consumer test project
        run: |
          # The lib-consumer-test project is already in the repository
          # Just ensure gradlew is executable
          chmod +x lib-consumer-test/gradlew

      - name: Build consumer project
        working-directory: lib-consumer-test
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Run consumer project
        working-directory: lib-consumer-test
        run: ./gradlew run

  jitpack-simulation:
    name: Simulate JitPack Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Simulate JitPack build
        run: |
          echo "Simulating JitPack build process..."
          ./gradlew clean build publishToMavenLocal -x test

      - name: Verify published artifacts
        run: |
          echo "Checking published artifacts in Maven Local..."
          ARTIFACT_DIR="$HOME/.m2/repository/com/mfdeveloper/fcm/fcm-send/0.1.1"
          
          if [ -d "$ARTIFACT_DIR" ]; then
            echo "✓ Artifact directory exists: $ARTIFACT_DIR"
            ls -la "$ARTIFACT_DIR"
            
            # Check for required files
            for file in "fcm-send-0.1.1.jar" "fcm-send-0.1.1.pom" "fcm-send-0.1.1-sources.jar"; do
              if [ -f "$ARTIFACT_DIR/$file" ]; then
                echo "✓ Found: $file"
              else
                echo "✗ Missing: $file"
                exit 1
              fi
            done
            
            echo ""
            echo "═══════════════════════════════════════════════════"
            echo " ✓ JitPack simulation successful!"
            echo "═══════════════════════════════════════════════════"
          else
            echo "✗ Artifact directory not found!"
            exit 1
          fi
