# =============================================================================
# Kotlin Tests - GitHub Actions Workflow
# =============================================================================
# Runs unit tests with JaCoCo coverage on push and pull requests.
#
# Run locally with: act -W .github/workflows/kotlin-tests.yml
# =============================================================================

name: Kotlin > Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'src/main/kotlin/**'
      - 'src/test/kotlin/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/kotlin-*.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/main/kotlin/**'
      - 'src/test/kotlin/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/kotlin-*.yml'
  workflow_dispatch: # Allow manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['17', '21']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.java-version }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.java-version }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport

      - name: Verify coverage threshold (80%)
        run: ./gradlew jacocoTestCoverageVerification

      - name: Upload coverage report (HTML)
        uses: actions/upload-artifact@v4
        if: matrix.java-version == '17'
        with:
          name: coverage-report-html
          path: build/reports/jacoco/test/html/

      - name: Upload coverage report (XML)
        uses: actions/upload-artifact@v4
        if: matrix.java-version == '17'
        with:
          name: coverage-report-xml
          path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: build/reports/tests/test/

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-17-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-17-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile Kotlin (checks for errors/warnings)
        run: ./gradlew compileKotlin compileTestKotlin

      - name: Check Gradle build health
        run: ./gradlew check -x test
